# Run the API and the Streamlit demo together, locally, from the same
# built image. The demo does NOT call the api service over HTTP - it
# uses src.predict directly, same as the API does - so there is no
# dependency between the two; they just happen to share an image.
#
# Usage:
#   docker compose up --build
#   API:  http://localhost:8000/docs
#   Demo: http://localhost:8501

services:
  api:
    build: .
    image: finshield:latest
    container_name: finshield-api
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  demo:
    build: .
    image: finshield:latest
    container_name: finshield-demo
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
